<!-- 09 · CTA final (bloco 11 da copy). Escuro, com a mesma composição do mockup:
     título à esquerda e o botão dourado grande, com o número, à direita. O fundo do
     mockup é uma foto de cidade que não veio nos arquivos; no lugar, os anéis do alvo
     do logo e a trajetória da flecha em arco (assinatura visual da copy). -->
<section class="secao secao--escura cta" id="contato" aria-labelledby="cta-titulo">
  <svg class="cta__fundo" viewBox="0 0 1440 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" data-revela>
    <defs>
      <radialGradient id="cta-brilho" cx="72%" cy="50%" r="42%">
        <stop offset="0" stop-color="#C9A24A" stop-opacity=".22"/>
        <stop offset=".55" stop-color="#C9A24A" stop-opacity=".05"/>
        <stop offset="1" stop-color="#C9A24A" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cta-arco" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#C9A24A" stop-opacity="0"/>
        <stop offset=".6" stop-color="#C9A24A" stop-opacity=".45"/>
        <stop offset="1" stop-color="#EACB7C" stop-opacity=".9"/>
      </linearGradient>
    </defs>
    <rect width="1440" height="520" fill="url(#cta-brilho)"/>
    <g class="cta__aneis" fill="none" stroke="#C9A24A">
      <circle cx="1040" cy="260" r="70" stroke-opacity=".34"/>
      <circle cx="1040" cy="260" r="140" stroke-opacity=".24"/>
      <circle cx="1040" cy="260" r="220" stroke-opacity=".16"/>
      <circle cx="1040" cy="260" r="310" stroke-opacity=".1"/>
      <circle cx="1040" cy="260" r="410" stroke-opacity=".06"/>
    </g>
    <path class="cta__trajetoria" d="M-60 430 C 300 405, 700 318, 1030 262" fill="none" stroke="url(#cta-arco)" stroke-width="1.4"/>
  </svg>

  <div class="container cta__grade">
    <div class="cta__texto" data-revela>
      <h2 class="titulo cta__titulo" id="cta-titulo">Vamos conectar <span class="destaque">a sua próxima cidade.</span></h2>
      <p class="texto-apoio">Conta pra gente o que você vende, a meta e onde quer chegar. A primeira conversa é pelo WhatsApp.</p>
    </div>

    <div class="cta__acao" data-revela style="--i:1">
      <a class="btn btn--ouro cta__btn" href="{{wa:empresa}}" target="_blank" rel="noopener" data-zap="cta-final">
        <span class="cta__zap"><i data-i="whatsapp-logo" data-w="regular"></i></span>
        <span class="cta__rotulos">
          <span class="cta__rotulo">Vender sem montar equipe</span>
          <span class="cta__numero">{{cfg.whatsappExibir}}</span>
        </span>
        <i data-i="arrow-right" data-w="bold" class="seta"></i>
      </a>
      <p class="cta__nota">Agente autorizado Fleetnet · Oeste paulista e Mato Grosso do Sul</p>
    </div>
  </div>
</section>
